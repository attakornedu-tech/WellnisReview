<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wellnis Review Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>" />
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1c1e21;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --good: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
    --bad-bg: #fef2f2;
    --chip-bg: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card-bg: #181b21;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --border: #2a2e37;
      --accent: #6ea8fe;
      --good: #4ade80;
      --warn: #fbbf24;
      --bad: #f87171;
      --bad-bg: #2a1616;
      --chip-bg: #1c2333;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sarabun", "Noto Sans Thai", Roboto, sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 20px 16px 8px;
    max-width: 960px;
    margin: 0 auto;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.9rem; }
  .summary-bar {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin: 14px 0 4px;
  }
  .stat {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    min-width: 120px;
  }
  .stat .num { font-size: 1.3rem; font-weight: 700; }
  .stat .label { color: var(--muted); font-size: 0.78rem; }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 8px 16px 60px;
    display: grid;
    gap: 12px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
  }
  .card.has-alert { border-color: var(--bad); }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .name { font-weight: 700; font-size: 1.05rem; }
  .rating-line { color: var(--muted); font-size: 0.88rem; margin-top: 2px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip {
    background: var(--chip-bg);
    color: var(--accent);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .chip.new { background: var(--chip-bg); }
  .chip.alert { background: var(--bad-bg); color: var(--bad); }
  .chip.stale { background: var(--bad-bg); color: var(--warn); }
  .caret { color: var(--muted); transition: transform 0.15s; }
  .card.open .caret { transform: rotate(90deg); }
  .details { display: none; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
  .card.open .details { display: block; }
  .section-title { font-weight: 700; font-size: 0.85rem; margin: 10px 0 4px; }
  .ai-summary { white-space: pre-wrap; font-size: 0.9rem; background: var(--chip-bg); border-radius: 10px; padding: 10px 12px; }
  .alert-box { background: var(--bad-bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .alert-box .review { font-size: 0.85rem; margin: 6px 0; }
  .review-item { font-size: 0.85rem; padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .review-item:last-child { border-bottom: none; }
  .maps-link { display: inline-block; margin-top: 10px; font-size: 0.85rem; color: var(--accent); text-decoration: none; }
  .maps-link:hover { text-decoration: underline; }
  .empty-state { text-align: center; color: var(--muted); padding: 60px 20px; }
  .error-state { text-align: center; color: var(--bad); padding: 40px 20px; }
  footer { text-align: center; color: var(--muted); font-size: 0.78rem; padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>⭐ Wellnis Review Dashboard</h1>
  <div class="sub" id="generated-at">กำลังโหลดข้อมูล...</div>
  <div class="summary-bar" id="summary-bar"></div>
</header>
<main id="main">
  <div class="empty-state">กำลังโหลด...</div>
</main>
<footer>อัปเดตอัตโนมัติทุกวัน 21:00 น. ผ่าน GitHub Actions · ข้อมูลจาก Google Places API</footer>

<script>
function starLine(rating, total) {
  if (rating == null) return "ไม่มีข้อมูลคะแนน";
  var full = Math.round(rating);
  return "⭐".repeat(Math.max(full, 0)) + " (" + rating.toFixed(1) + ") จาก " + (total || 0) + " รีวิว";
}

function fmtDate(iso) {
  if (!iso) return "ไม่ทราบ";
  try {
    var d = new Date(iso);
    return d.toLocaleString("th-TH", { timeZone: "Asia/Bangkok", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) + " น.";
  } catch (e) { return iso; }
}

function daysAgo(iso) {
  if (!iso) return null;
  var d = new Date(iso);
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}

function esc(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderBranch(b) {
  var card = document.createElement("div");
  card.className = "card";

  if (b.status === "no_place_id" || b.status === "fetch_error") {
    card.innerHTML =
      '<div class="card-top"><div><div class="name">' + esc(b.name) + '</div>' +
      '<div class="rating-line">⚠️ ' + (b.status === "no_place_id" ? "ยังไม่ได้ผูก place_id" : "ดึงข้อมูลไม่สำเร็จล่าสุด") + '</div></div></div>';
    return card;
  }

  var hasAlert = (b.low_rating_alerts_today || []).length > 0;
  if (hasAlert) card.classList.add("has-alert");

  var chips = "";
  if (b.new_reviews_today > 0) {
    chips += '<span class="chip new">📝 รีวิวใหม่ ' + b.new_reviews_today + '</span>';
  } else {
    var da = daysAgo(b.last_review_time);
    chips += '<span class="chip stale">รีวิวล่าสุด: ' + fmtDate(b.last_review_time) + (da != null ? ' (' + da + ' วันก่อน)' : '') + '</span>';
  }
  if (hasAlert) {
    chips += '<span class="chip alert">⚠️ ต้องติดตาม ' + b.low_rating_alerts_today.length + ' รายการ</span>';
  }

  var top = document.createElement("div");
  top.className = "card-top";
  top.innerHTML =
    '<div><div class="name">' + esc(b.name) + '</div>' +
    '<div class="rating-line">' + starLine(b.rating, b.user_ratings_total) + '</div>' +
    '<div class="badges">' + chips + '</div></div>' +
    '<div class="caret">▶</div>';
  card.appendChild(top);

  var details = document.createElement("div");
  details.className = "details";

  var html = "";
  if (hasAlert) {
    html += '<div class="section-title">⚠️ รีวิวที่ต้องติดตามวันนี้ (≤3 ดาว)</div><div class="alert-box">';
    b.low_rating_alerts_today.forEach(function (r) {
      html += '<div class="review">' + (r.rating || "?") + '⭐ โดย ' + esc(r.author) + ': ' + esc(r.text || "(ไม่มีข้อความ)") + '</div>';
    });
    html += '</div>';
  }

  html += '<div class="section-title">🤖 AI สรุปคำชมที่พบบ่อย</div>';
  html += '<div class="ai-summary">' + esc(b.ai_summary || "ยังไม่มีสรุป") + '</div>';

  if (b.recent_reviews && b.recent_reviews.length) {
    html += '<div class="section-title">รีวิวล่าสุด</div>';
    b.recent_reviews.slice(0, 5).forEach(function (r) {
      html += '<div class="review-item">' + (r.rating || "?") + '⭐ ' + esc(r.author) + ' — ' + esc((r.text || "").slice(0, 140)) + (r.text && r.text.length > 140 ? "…" : "") + '</div>';
    });
  }

  html += '<a class="maps-link" href="' + esc(b.maps_url) + '" target="_blank" rel="noopener">🔗 เปิดใน Google Maps</a>';

  details.innerHTML = html;
  card.appendChild(details);

  top.addEventListener("click", function () {
    card.classList.toggle("open");
  });

  return card;
}

function renderSummaryBar(data) {
  var bar = document.getElementById("summary-bar");
  var branches = data.branches || [];
  var totalNew = branches.reduce(function (s, b) { return s + (b.new_reviews_today || 0); }, 0);
  var totalAlerts = branches.reduce(function (s, b) { return s + ((b.low_rating_alerts_today || []).length); }, 0);
  var ratings = branches.filter(function (b) { return b.rating != null; }).map(function (b) { return b.rating; });
  var avg = ratings.length ? (ratings.reduce(function (a, b) { return a + b; }, 0) / ratings.length).toFixed(2) : "-";

  bar.innerHTML =
    '<div class="stat"><div class="num">' + branches.length + '</div><div class="label">สาขาทั้งหมด</div></div>' +
    '<div class="stat"><div class="num">' + totalNew + '</div><div class="label">รีวิวใหม่วันนี้</div></div>' +
    '<div class="stat"><div class="num" style="color:var(--bad)">' + totalAlerts + '</div><div class="label">ต้องติดตาม (≤3⭐)</div></div>' +
    '<div class="stat"><div class="num">' + avg + '</div><div class="label">คะแนนเฉลี่ยทุกสาขา</div></div>';
}

fetch("data.json?_=" + Date.now())
  .then(function (r) { return r.json(); })
  .then(function (data) {
    var main = document.getElementById("main");
    var branches = data.branches || [];

    document.getElementById("generated-at").textContent = data.generated_at
      ? "อัปเดตล่าสุด: " + fmtDate(data.generated_at)
      : "ยังไม่มีข้อมูล — รอ GitHub Action รันรอบแรก (ทุกวัน 21:00 น. หรือรันเองได้จาก tab Actions)";

    if (!branches.length) {
      main.innerHTML = '<div class="empty-state">ยังไม่มีข้อมูลสาขา<br>ตรวจสอบว่าตั้งค่า Secrets และรัน workflow "Daily review sync" แล้ว</div>';
      return;
    }

    renderSummaryBar(data);

    // เรียงให้สาขาที่ต้องติดตามด่วนขึ้นก่อน
    branches.sort(function (a, b) {
      var av = (a.low_rating_alerts_today || []).length;
      var bv = (b.low_rating_alerts_today || []).length;
      return bv - av;
    });

    main.innerHTML = "";
    branches.forEach(function (b) { main.appendChild(renderBranch(b)); });
  })
  .catch(function (err) {
    document.getElementById("main").innerHTML = '<div class="error-state">โหลดข้อมูลไม่สำเร็จ: ' + esc(String(err)) + '</div>';
  });
</script>
</body>
</html>
