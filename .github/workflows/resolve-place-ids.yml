name: Resolve place IDs (one-time setup)

# รันด้วยมือครั้งเดียวตอนตั้งระบบ (หรือทุกครั้งที่เพิ่ม/แก้ไขสาขาใน branches.json)
# ไปที่ tab Actions -> เลือก workflow นี้ -> Run workflow
on:
  workflow_dispatch:
    inputs: {}

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve place_id for every branch missing one
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        # CI has no interactive terminal, so this always runs with --yes (auto-pick top match).
        # Review the branches.json diff / job summary below afterwards to confirm each match.
        run: python scripts/resolve_place_ids.py --yes

      - name: Commit branches.json
        run: |
          git config user.name "wellnis-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add branches.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: resolve place_id for branches"
            git push
          fi

      - name: Summary
        run: |
          echo "### ผลลัพธ์การผูก place_id" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat branches.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️ กรุณาตรวจสอบว่าที่อยู่ (formattedAddress) ตรงกับแต่ละสาขาจริง ก่อนปล่อยให้ระบบรันอัตโนมัติ" >> "$GITHUB_STEP_SUMMARY"
